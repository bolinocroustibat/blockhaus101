[project]
name = "blockhaus101"
version = "1.5.1"
description = "blockhaus 101 expose chaque semaine une nouvelle voix marginale de l’art contemporain. Uniquement sur rendez-vous."
authors = [{ name = "Adrien Carpentier", email = "me@adriencarpentier.com" }]
dependencies = [
    "Babel<3.0.0,>=2.10.3",
    "coloredlogs<16.0,>=15.0",
    "Django<4.3,>=4.2",
    "django-debug-toolbar<4.0.0,>=3.2.1",
    "django-simple-captcha<1.0.0,>=0.5.17",
    "gunicorn<21.0.0,>=20.1.0",
    "PyMySQL<2.0.0,>=1.0.2",
    "requests<3.0.0,>=2.25.1",
    "sentry-sdk<2.0.0,>=1.15.0",
    "tweepy<4.0.0,>=3.8.0",
    "uvicorn<1.0.0,>=0.14.0",
    "xmltodict<1.0.0,>=0.12.0",
]
requires-python = ">=3.11,<4.0"
license = { text = "MIT" }

[project.urls]
homepage = "https://www.blockhaus101.com"

[build-system]
requires = ["pdm-pep517>=1.0.0"]
build-backend = "pdm.pep517.api"

[tool.pdm]
includes = []

[tool.pdm.dev-dependencies]
dev = ["black>=23.1.0", "ruff>=0.0.247"]

[tool.pdm.build]
includes = []
