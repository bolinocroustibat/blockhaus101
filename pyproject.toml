[project]
name = "blockhaus101"
version = "1.6.5"
description = "blockhaus 101 expose chaque semaine une nouvelle voix marginale de l’art contemporain. Uniquement sur rendez-vous."
authors = [{ name = "Adrien Carpentier", email = "me@adriencarpentier.com" }]
dependencies = [
    "Babel<3.0.0,>=2.10.3",
    "coloredlogs<16.0,>=15.0",
    "Django<5.2,>=5.0",
    "django-debug-toolbar<5.0.0,>=4.0.0",
    "django-simple-captcha<1.0.0,>=0.5.17",
    "gunicorn<23.0.0,>=22.0.0",
    "psycopg[binary]<4.0.0,>=3.1.8",
    "requests<3.0.0,>=2.25.1",
    "sentry-sdk<3.0.0,>=2.0.0",
    "tweepy<4.0.0,>=3.8.0",
    "uvicorn<=0.31.0",
    "xmltodict<1.0.0,>=0.12.0",
    "openai>=1.35.3",
]
requires-python = ">=3.11,<4.0"
license = { text = "MIT" }

[project.urls]
homepage = "https://www.blockhaus101.com"

[build-system]
requires = ["pdm-pep517>=1.0.0"]
build-backend = "pdm.pep517.api"

[tool.mypy]
[[tool.mypy.overrides]]
module = [
    "captcha.fields",
    "debug_toolbar.*",
    "django.*",
    "requests.*",
    "tweepy.*",
]
ignore_missing_imports = true

[tool.rye]
dev-dependencies = [
    "ruff>=0.5.5",
    "mypy>=1.8.0",
    "googletrans-py>=4.0.0",
]

[tool.pdm]
distribution = false
dev-dependencies = { dev = ["ruff>=0.5.5", "mypy>=1.8.0"] }

[tool.pdm.build]
includes = []

[tool.ruff]
line-length = 100
lint = { extend-select = ["I"], ignore = ["F401"] }

[tool.setuptools]
py-modules = []
