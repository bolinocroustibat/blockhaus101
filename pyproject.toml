[project]
name = "blockhaus101"
version = "1.2.0"
description = "blockhaus 101 expose chaque semaine une nouvelle voix marginale de l’art contemporain. Uniquement sur rendez-vous."
authors = [{ name = "Adrien Carpentier", email = "me@adriencarpentier.com" }]
dependencies = [
    "coloredlogs<16.0,>=15.0",
    "Babel<3.0.0,>=2.10.3",
    "Django<4.2,>=4.1",
    "django-debug-toolbar<4.0.0,>=3.2.1",
    "gunicorn<21.0.0,>=20.1.0",
    "PyMySQL<2.0.0,>=1.0.2",
    "requests<3.0.0,>=2.25.1",
    "sentry-sdk<2.0.0,>=1.9.10",
    "toml<1.0.0,>=0.10.2",
    "tweepy<4.0.0,>=3.8.0",
    "uvicorn<1.0.0,>=0.14.0",
    "xmltodict<1.0.0,>=0.12.0",
]
requires-python = ">=3.9,<3.10"
dynamic = ["classifiers", "classifiers"]
license = { text = "MIT" }

[project.urls]
homepage = "https://www.blockhaus101.com"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "blockhaus101"
version = "1.1.1"
description = ""
authors = ["Adrien Carpentier <me@adriencarpentier.com>"]

[tool.poetry.dependencies]
python = "3.9.*"
Babel = "^2.10.3"
coloredlogs = "^15.0"
Django = "^4.1"
django-debug-toolbar = "^3.2.1"
gunicorn = "^20.1.0"
PyMySQL = "^1.0.2"
requests = "^2.25.1"
sentry-sdk = "^1.9.10"
toml = "^0.10.2"
tweepy = "^3.8.0"
uvicorn = "^0.14.0"
xmltodict = "^0.12.0"

[tool.poetry.dev-dependencies]
black = "^21.4b2"
isort = "^5.10.1"


[tool.poetry.group.dev.dependencies]
ipython = "^8.4.0"

[tool.pdm]
includes = []

[tool.pdm.dev-dependencies]
dev = ["black<22.0,>=21.4b2"]
