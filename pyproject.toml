[build-system]
requires = ["setuptools>=82", "setuptools-scm[toml]>=9"]
build-backend = "setuptools.build_meta"

[project]
name = "blockhaus101"
dynamic = ["version"]
description = "blockhaus 101 expose chaque semaine une nouvelle voix marginale de l’art contemporain. Uniquement sur rendez-vous."
authors = [{ name = "Adrien Carpentier", email = "me@adriencarpentier.com" }]
dependencies = [
    "babel<3.0.0,>=2.10.3",
    "colorlog>=6.9.0",
    "dj-database-url>=3.1.2",
    "Django<7.0.0,>=5.2.6",
    "django-debug-toolbar<7.0.0,>=4.0.0",
    "django-htmx>=1.27.0",
    "django-simple-captcha<1.0.0,>=0.5.17",
    "gunicorn<25.0.0,>=23.0.0",
    "niquests>=3.19.1",
    "openai>=1.107.0",
    "psycopg[binary]<4.0.0,>=3.1.8",
    "python-dotenv>=1.2.1",
    "sentry-sdk<3.0.0,>=2.0.0",
    "tweepy<5.0.0,>=3.8.0",
    "uvicorn>=0.35.0",
]
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
readme = "README.md"

[project.urls]
homepage = "https://www.blockhaus101.com"

[dependency-groups]
dev = [
    "django-stubs>=5.2.0",
    "googletrans-py>=4.0.0",
    "ruff>=0.12.11",
    "setuptools-scm[toml]>=9",
    "ty>=0.0.16",
]

[tool.ty.src]
exclude = ["**/migrations/"]
[tool.ty.analysis]
allowed-unresolved-imports = [
    "captcha.**",
    "debug_toolbar.**",
    "django.**",
    "openai.**",
    "tweepy.**",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["ASYNC", "I", "PTH"]

[tool.ruff.lint.per-file-ignores]
# Django migrations use class-level list defaults (`dependencies`, `operations`).
"**/migrations/*.py" = ["RUF012"]

# Necessary to avoid issues when installing when using `pip install .`
[tool.setuptools]
py-modules = []

[tool.setuptools_scm]
# Derive version from Git tags (e.g. v1.16.24 or 1.16.24)
