[project]
name = "blockhaus101"
version = "1.16.10"
description = "blockhaus 101 expose chaque semaine une nouvelle voix marginale de l’art contemporain. Uniquement sur rendez-vous."
authors = [{ name = "Adrien Carpentier", email = "me@adriencarpentier.com" }]
dependencies = [
    "babel<3.0.0,>=2.10.3",
    "colorlog>=6.8.2",
    "Django<5.2.0,>=5.1.0",
    "django-debug-toolbar<5.0.0,>=4.0.0",
    "django-htmx>=1.21.0",
    "django-simple-captcha<1.0.0,>=0.5.17",
    "gunicorn<24.0.0,>=23.0.0",
    "httpx>=0.27.0",
    "openai>=1.42.0",
    "psycopg[binary]<4.0.0,>=3.1.8",
    "python-dotenv>=1.0.1",
    "sentry-sdk<3.0.0,>=2.0.0",
    "tweepy<4.0.0,>=3.8.0",
    "uvicorn<=0.31.0",
]
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

[project.urls]
homepage = "https://www.blockhaus101.com"

[tool.mypy]
[[tool.mypy.overrides]]
module = [
    "captcha.fields",
    "debug_toolbar.*",
    "django.*",
    "openai.*",
    "tweepy.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
lint = { extend-select = ["I"] }

# Necessary to avoid issues when installing when using `pip install .`
[tool.setuptools]
py-modules = []

[tool.uv]
dev-dependencies = [
    "googletrans-py>=4.0.0",
    "mypy>=1.11.2",
    "ruff>=0.8.0",
]
