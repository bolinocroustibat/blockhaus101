[project]
name = "blockhaus101"
version = "1.16.18"
description = "blockhaus 101 expose chaque semaine une nouvelle voix marginale de l’art contemporain. Uniquement sur rendez-vous."
authors = [{ name = "Adrien Carpentier", email = "me@adriencarpentier.com" }]
dependencies = [
    "babel<3.0.0,>=2.10.3",
    "colorlog>=6.9.0",
    "Django<6.0.0,>=5.2.6",
    "django-debug-toolbar<5.0.0,>=4.0.0",
    "django-htmx>=1.23.2",
    "django-simple-captcha<1.0.0,>=0.5.17",
    "gunicorn<24.0.0,>=23.0.0",
    "httpx>=0.28.0",
    "openai>=1.107.0",
    "psycopg[binary]<4.0.0,>=3.1.8",
    "python-dotenv>=1.0.1",
    "sentry-sdk<3.0.0,>=2.0.0",
    "tweepy<4.0.0,>=3.8.0",
    "uvicorn>=0.35.0",
]
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
readme = "README.md"

[project.optional-dependencies]
dev = [
    "googletrans-py>=4.0.0",
    "ruff>=0.12.11",
]

[project.urls]
homepage = "https://www.blockhaus101.com"

[tool.mypy]
[[tool.mypy.overrides]]
module = [
    "captcha.fields",
    "debug_toolbar.*",
    "django.*",
    "openai.*",
    "tweepy.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
lint = { extend-select = ["ASYNC", "I", "PTH"] }

# Necessary to avoid issues when installing when using `pip install .`
[tool.setuptools]
py-modules = []
