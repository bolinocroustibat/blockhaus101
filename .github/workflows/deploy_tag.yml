name: Deploy to prod when tag

on:
  push:
    tags:
      - '*'

jobs:
  deploy-prod:
    name: Deploy to prod from "${{ github.ref_name }}/${{ github.sha }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.SSH_HOST }}

      - name: Adding known hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }}  >> ~/.ssh/known_hosts

      - name: Copy repository to server with rsync
        run: rsync -avz --chown=github:www-data --chmod=Dg=rwx,Fg=rwx ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/www/blockhaus101/ # We set directory (D) and files (F) permission for group www-data to rwx so that the same users can overwrite later

      # - name: Copy repository to server with rsync
      #   uses: burnett01/rsync-deployments@5.2.1
      #   with:
      #     switches: -avzr
      #     path: ./
      #     remote_path: /home/www/blockhaus101/
      #     remote_host: ${{ secrets.SSH_HOST }}
      #     remote_user: ${{ secrets.SSH_USER }}
      #     remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Execute server commands for deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/www/blockhaus101
            source /home/www/blockhaus101/venv/bin/activate
            pip install -r /home/www/blockhaus101/requirements.txt
            python3 /home/www/blockhaus101/manage.py migrate
            python3 /home/www/blockhaus101/manage.py collectstatic --no-input
            sudo systemctl restart blockhaus101.service

      - name: Create Sentry release
        uses: getsentry/action-release@v1.2.1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: "adrien-carpentier"
          SENTRY_PROJECT: "blockhaus101"
        with:
          environment: production
          version: ${{ github.ref_name }}
