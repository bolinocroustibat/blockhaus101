name: Test

on:
  push:
    branches:
      - main
  workflow_call:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: blockhaus101_django
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blockhaus101_django"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/blockhaus101_django
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # setuptools-scm reads tags and history to resolve the version
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Run tests
        run: uv run python manage.py test
