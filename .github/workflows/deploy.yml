name: Deploy to prod when tag

on:
  push:
    tags:
      - '*'

jobs:

  bump-version:
    name: Bump version
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Bump version in pyproject.toml and uv.lock to ${{ github.ref_name }}
        run: |
          sed -i 's/^version = .*/version = "${{ github.ref_name }}"/' pyproject.toml
          uv lock

      - name: Commit and push updated pyproject.toml and uv.lock
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "chore: bump version to ${{ github.ref_name }}"
          commit_user_name: Adrien Carpentier
          commit_user_email: me@adriencarpentier.com
          commit_author: Adrien Carpentier <me@adriencarpentier.com>

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: bump-version
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-changelog.outputs.commit_hash }} # https://schnerring.net/blog/checking-out-code-committed-within-the-same-github-actions-workflow-run/

      - name: Execute server commands for deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /home/www/blockhaus101
            git fetch
            git reset --hard origin/main
            /usr/local/bin/uv/uv sync
            /usr/local/bin/uv/uv run /home/www/blockhaus101/manage.py migrate
            /usr/local/bin/uv/uv run /home/www/blockhaus101/manage.py collectstatic --no-input
            sudo systemctl restart blockhaus101.service

      - name: Create Sentry "${{ github.ref_name }}" release
        uses: getsentry/action-release@v1.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: "adrien-carpentier"
          SENTRY_PROJECT: "blockhaus101"
        with:
          environment: production
          version: ${{ github.ref_name }}
