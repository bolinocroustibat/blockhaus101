name: Deploy to prod when tag

on:
  push:
    tags:
      - '*'

jobs:

  deploy-prod:

    name: Deploy to prod from ${{ github.ref_name }}/${{ github.sha }}

    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the changed files back to the repository.
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bump version in pyproject.toml to ${{ github.ref_name }}
        run: sed -i 's/^ *version.*=.*"\([^"]*\)".*/version = "${{ github.ref_name }}"/' ./pyproject.toml

      - name: Commit and push updated pyproject.toml
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "chore: bump version to ${{ github.ref_name }}"
          # Optional commit user and author settings
          commit_user_name: Adrien Carpentier # defaults to "github-actions[bot]"
          commit_user_email: me@adriencarpentier.com # defaults to "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: Adrien Carpentier <me@adriencarpentier.com> # defaults to "username <username@users.noreply.github.com>", where "username" belongs to the author of the commit that triggered the run

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.SSH_HOST }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy repository to server with rsync
        run: rsync -avz --exclude '.git' --chown=github:www-data --chmod=Dg=rwx,Fg=rwx ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/www/blockhaus101/ # We set directory (D) and files (F) permission for group www-data to rwx so that the same users can overwrite later

      - name: Execute server commands for deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/www/blockhaus101
            source /home/www/blockhaus101/.venv/bin/activate
            pip3 install /home/www/blockhaus101/.
            python3 /home/www/blockhaus101/manage.py migrate
            python3 /home/www/blockhaus101/manage.py collectstatic --no-input
            sudo systemctl restart blockhaus101.service

      - name: Create Sentry "${{ github.ref_name }}" release
        uses: getsentry/action-release@v1.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: "adrien-carpentier"
          SENTRY_PROJECT: "blockhaus101"
        with:
          environment: production
          version: ${{ github.ref_name }}
