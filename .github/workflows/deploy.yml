name: Deploy to prod when tag

on:
  push:
    tags:
      - '*'

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }} to prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      - name: Execute server commands for deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e  # Exit on any error

            # Ensure directory exists
            mkdir -p /home/www/blockhaus101
            cd /home/www/blockhaus101

            # Clone or update the repository for configuration files
            if [ -d .git ]; then
              git fetch
              git reset --hard origin/main
            else
              git clone https://github.com/bolinocroustibat/blockhaus101.git .
            fi

            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Set Docker image tag for pull/run
            export TAG="${{ github.ref_name }}"

            # Pull the new Docker images
            docker compose pull
            # Restart services
            docker compose down
            docker compose up -d

            # Verify service is running
            sleep 3  # Give the service time to start
            if ! docker compose ps --format json | grep -q "running"; then
              echo "Service failed to start properly"
              docker compose logs
              exit 1
            fi

  create-sentry-release:
    name: Create Sentry release
    needs: deploy
    runs-on: ubuntu-latest
    if: success()  # Only create Sentry release if deployment succeeded
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: "adrien-carpentier"
          SENTRY_PROJECT: "blockhaus101"
        with:
          environment: production
          release: ${{ github.ref_name }}
