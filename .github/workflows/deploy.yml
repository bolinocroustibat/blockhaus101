name: Deploy to prod when tag

on:
  push:
    tags:
      - '*'

jobs:

  deploy-prod:

    name: Deploy to prod from ${{ github.ref_name }}/${{ github.sha }}

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Bump version in pyproject.toml and uv.lock to ${{ github.ref_name }}
        run: |
          sed -i 's/^ *version.*=.*"\([^"]*\)".*/version = "${{ github.ref_name }}"/' ./pyproject.toml
          uv lock

      - name: Commit and push updated pyproject.toml and uv.lock
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "chore: bump version to ${{ github.ref_name }}"
          commit_user_name: Adrien Carpentier
          commit_user_email: me@adriencarpentier.com
          commit_author: Adrien Carpentier <me@adriencarpentier.com>

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.SSH_HOST }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Execute server commands for deploy
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /home/www/blockhaus101
            git fetch origin main
            git reset --hard origin/main
            /usr/local/bin/uv/bin/uv sync
            /usr/local/bin/uv/bin/uv run /home/www/blockhaus101/manage.py migrate
            /usr/local/bin/uv/bin/uv run /home/www/blockhaus101/manage.py collectstatic --no-input
            sudo systemctl restart blockhaus101.service

      - name: Create Sentry "${{ github.ref_name }}" release
        uses: getsentry/action-release@v1.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: "adrien-carpentier"
          SENTRY_PROJECT: "blockhaus101"
        with:
          environment: production
          version: ${{ github.ref_name }}
