{% extends "base.html" %}

{% block meta %}
<title>blockhaus 101 - expositions précédentes</title>
<meta name="Description" content="" />
<meta property="og:title" content="blockhaus 101 - expositions précédentes" />
<meta property="og:description" content="" />
<meta property="og:image" content="" />
{% endblock %}


{% block content %}

{% for e in full_exhibs %}
<div class="past-expo-date mb-4 mt-5">Du {{ e.startdate }} au {{ e.enddate }} :</div>
<div class="project-wrapper">
	<span class="artist">{{ e.name }}</span>&nbsp;|&nbsp;<span class="expo">{{ e.title|capfirst }}</span>
	<div class="bio">{{ e.bio }}</div>
	<div class="text">{{ e.text }}</div>
</div>
{% endfor %}

{% endblock %}
