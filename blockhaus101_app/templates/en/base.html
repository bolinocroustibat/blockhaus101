{% load static %}

<!DOCTYPE html>
<html lang="fr">

<head>

	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	{% block meta %}
	{% endblock %}
	<meta property="og:url" content="{{ request.get_full_path }}" />
	<meta property="og:site_name" content="søren bollinger contemporary art gallery" />
	<meta property="og:type" content="website" />
	<meta property="og:locale" content="en_EN">

	<link rel="icon" type="image/png" href="{% static 'favicons/favicon-16x16.png' %}" sizes="16x16" />
	<link rel="icon" type="image/png" href="{% static 'favicons/favicon-32x32.png' %}" sizes="32x32" />
	<link rel="manifest" href="{% static 'favicons/manifest.json' %}" />
	<link rel="mask-icon" href="{% static 'favicons/safari-pinned-tab.svg' %}" color="#5bbad5">
	<link rel="shortcut icon" href="{% static 'favicons/favicon.ico' %}" />
	<meta name="msapplication-config" content="{% static 'favicons/browserconfig.xml' %}" />
	<meta name="theme-color" content="#ffffff" />

	<link href="{% static 'style.css' %}" rel="stylesheet" type="text/css" media="all" />
	<script src="{% static 'js/main.js' %}" defer></script>

	<!-- Global site tag (gtag.js) - Google Analytics -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=UA-115226891-1"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag() { dataLayer.push(arguments); }
		gtag('js', new Date());

		gtag('config', 'UA-115226891-1');
	</script>

</head>

<body>

	<div id="main-wrapper" class="col-10 offset-1 mt-5">

		<h1>galerie søren bollinger</h1>
		<h2>paris・københavn・austin・beijing</h2>

		<nav class="mt-3 mb-5">
			<ul>
				<li>
					<a href="{% url 'index' lang='en' %}" class="{% if request.resolver_match.url_name == "index" %}active{% endif %}">this month</a>
				</li>
				&nbsp;&nbsp;|&nbsp;&nbsp;
				<li>
					<a href="{% url 'past_exhibitions' lang='en' %}" class="{% if request.resolver_match.url_name == "past_exhibitions" %}active{% endif %}">past exhibitions</a>
				</li>
				&nbsp;&nbsp;|&nbsp;&nbsp;
				<li>
					<a href="{% url 'contact' lang='en' %}" class="{% if request.resolver_match.url_name == "contact" %}active{% endif %}">visits</a>
				</li>
			</ul>
		</nav>

		{% block content %}
		{% endblock %}

	</div>

</body>

</html>
