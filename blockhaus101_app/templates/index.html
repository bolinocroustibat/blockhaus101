{% extends "base.html" %}

{% block meta %}
<title>blockhaus 101 - {{ artist_name }} - {{ expo_title|capfirst }}</title>
<meta name="Description" content="{{ expo_text }}" />
<meta property="og:title" content="blockhaus 101 - {{ artist_name }} - {{ expo_title|capfirst }}" />
<meta property="og:description" content="{{ expo_text }}" />
<meta property="og:image" content="" />
{% endblock %}


{% block content %}
<div class="past-expo-date mb-4 mt-5">
	{{ description }}
	<div class="mt-5">Du {{ expo_startdate }} au {{ expo_enddate }} :</div>
</div>

<div class="col-lg-8 col-12 mb-5 project-wrapper">
	<span class="artist">{{ artist_name }}</span>&nbsp;|&nbsp;<span class="expo">{{ expo_title|capfirst }}</span>
	<div class="bio">{{ artist_bio }}</div>
	<div class="text">{{ expo_text }}</div>
</div>

{% endblock %}
