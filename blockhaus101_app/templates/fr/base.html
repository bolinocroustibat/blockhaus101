{% load static %}

<!DOCTYPE html>
<html lang="fr">

<head>

	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	{% block meta %}
	{% endblock %}
	<meta property="og:url" content="{{ request.get_full_path }}" />
	<meta property="og:site_name" content="blockhaus 101" />
	<meta property="og:type" content="website" />
	<meta property="og:locale" content="fr_FR">

	<link rel="apple-touch-icon" sizes="180x180" href={% static 'favicons/apple-touch-icon.png' %}" />
	<link rel="icon" type="image/png" href={% static 'favicons/favicon-32x32.png' %}" sizes="32x32" />
	<link rel="icon" type="image/png" href="{% static 'favicons/favicon-16x16.png' %}" sizes="16x16" />
	<link rel="manifest" href="{% static 'favicons/manifest.json' %}" />
	<link rel="mask-icon" href="{% static 'favicons/safari-pinned-tab.svg' %}" color="#5bbad5">
	<link rel="shortcut icon" href="{% static 'favicons/favicon.ico' %}" />
	<meta name="msapplication-config" content="{% static 'favicons/browserconfig.xml' %}" />
	<meta name="theme-color" content="#ffffff" />

	<link rel="stylesheet" href="//maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
		integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
	<link href="{% static 'style.css' %}" rel="stylesheet" type="text/css" media="all" />

	<!-- Global site tag (gtag.js) - Google Analytics -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=UA-115226891-1"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag() { dataLayer.push(arguments); }
		gtag('js', new Date());

		gtag('config', 'UA-115226891-1');
	</script>

</head>

<body>

	<div id="main-wrapper" class="col-10 offset-1 mt-5">

		<h1>
			<span class="big_h1">blockhaus 101</span>
			galerie éphémère - paris 20
		</h1>

		<nav class="mt-3 mb-5">
			<ul>
				<li>
					<a href="{% url 'index' lang='fr' %}" class="{% if request.resolver_match.url_name == "index" %}active{% endif %}">ce mois-ci</a>
				</li>
				&nbsp;&nbsp;|&nbsp;&nbsp;
				<li>
					<a href="{% url 'past_exhibitions' lang='fr' %}" class="{% if request.resolver_match.url_name == "past_exhibitions" %}active{% endif %}">expositions précédentes</a>
				</li>
				&nbsp;&nbsp;|&nbsp;&nbsp;
				<li>
					<a href="{% url 'contact' lang='fr' %}" class="{% if request.resolver_match.url_name == "contact" %}active{% endif %}">visites</a>
				</li>
				&nbsp;&nbsp;|&nbsp;&nbsp;
				<li>
					<a href="//twitter.com/blockhaus101">@blockhaus101</a>
				</li>
			</ul>
		</nav>

		{% block content %}
		{% endblock %}

	</div>

</body>

</html>
