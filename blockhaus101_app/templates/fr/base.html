{% load site %}
{% load static %}

<!DOCTYPE html>
<html lang="fr">

<head>

	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	{% block meta %}
	{% endblock %}
	<link rel="canonical" href="{% absolute_uri %}" />
	<link rel="alternate" hreflang="fr" href="{% language_url 'fr' %}" />
	<link rel="alternate" hreflang="en" href="{% language_url 'en' %}" />
	<link rel="alternate" hreflang="x-default" href="{% language_url 'fr' %}" />
	<meta property="og:url" content="{% absolute_uri %}" />
	<meta property="og:site_name" content="galerie søren bollinger" />
	<meta property="og:type" content="website" />
	<meta property="og:locale" content="fr_FR" />
	<meta property="og:locale:alternate" content="en_US" />

	<link rel="icon" type="image/png" href="{% static 'favicons/favicon-16x16.png' %}" sizes="16x16" />
	<link rel="icon" type="image/png" href="{% static 'favicons/favicon-32x32.png' %}" sizes="32x32" />
	<link rel="manifest" href="{% static 'favicons/manifest.json' %}" />
	<link rel="mask-icon" href="{% static 'favicons/safari-pinned-tab.svg' %}" color="#5bbad5">
	<link rel="shortcut icon" href="{% static 'favicons/favicon.ico' %}" />
	<meta name="msapplication-config" content="{% static 'favicons/browserconfig.xml' %}" />
	<meta name="theme-color" content="#ffffff" />

	<link href="{% static 'style.css' %}" rel="stylesheet" type="text/css" media="all" />
	<script src="{% static 'js/htmx.min.js' %}"></script>

	<!-- Google tag (gtag.js) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-45QR4X373E"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag() { dataLayer.push(arguments); }
		gtag('js', new Date());

		gtag('config', 'G-45QR4X373E');
	</script>

</head>

<body>

	<div id="main-wrapper">

		<h1>galerie søren bollinger</h1>
		<h2>paris・københavn・austin・beijing</h2>

		<nav>
			<ul>
				<li>
					<a href="{% url 'index' lang='fr' %}" class="{% if request.resolver_match.url_name == "index" %}active{% endif %}">ce mois-ci</a>
				</li>
				<li>
					<a href="{% url 'past_exhibitions' lang='fr' %}" class="{% if request.resolver_match.url_name == "past_exhibitions" %}active{% endif %}">expositions précédentes</a>
				</li>
				<li>
					<a href="{% url 'contact' lang='fr' %}" class="{% if request.resolver_match.url_name == "contact" %}active{% endif %}">visites</a>
				</li>
			</ul>
		</nav>

		{% block content %}
		{% endblock %}

	</div>

</body>

</html>
