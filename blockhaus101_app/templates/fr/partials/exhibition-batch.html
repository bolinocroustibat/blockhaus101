{% for e in exhibitions_details %}
<div class="past-expo-date mb-4 mt-5">Du {{ e.startdate }} au {{ e.enddate }}</div>
<div class="col-lg-8 col-12 mb-5 expo-wrapper">
    <div class="expo-text-wrapper">
        <span class="artist">{{ e.name }}</span>&nbsp;|&nbsp;<span class="expo">{{ e.title|capfirst }}</span>
        <div class="bio">{{ e.bio }}</div>
        <div class="text">{{ e.text }}</div>
    </div>
    {% if e.image1 %}
    <img src="{{ e.image1 }}"
         loading="lazy"
         hx-on="load: this.classList.add('htmx-settling')" />
    {% endif %}
</div>
{% endfor %}

{% if page_obj.has_next %}
<div
    hx-get="{% url 'past_exhibitions' lang=lang %}?page={{ page_obj.next_page_number }}"
    hx-trigger="revealed"
    hx-swap="afterend"
    class="loading-trigger">
    <div class="loading-indicator">Chargement...</div>
</div>
{% endif %}
