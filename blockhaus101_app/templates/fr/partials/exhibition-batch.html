{% for e in exhibitions_details %}
<div class="exhibition-date">Du {{ e.startdate }} au {{ e.enddate }}</div>
<div class="exhibition-item expo-wrapper">
    <div class="expo-text-wrapper">
        <span class="artist">{{ e.name }}</span>&nbsp;|&nbsp;<span class="expo-title">{{ e.title|capfirst }}</span>
        <div class="bio">{{ e.bio }}</div>
        <div class="text">{{ e.text }}</div>
    </div>
    {% if e.image1 %}
    <img src="{{ e.image1 }}" />
    {% endif %}
</div>
{% endfor %}

{% if page_obj.has_next %}
<div
    hx-get="{% url 'past_exhibitions' lang=lang %}?page={{ page_obj.next_page_number }}"
    hx-trigger="revealed"
    hx-swap="afterend"
    hx-swap-oob="true"
    class="loading-trigger">
    <div class="loading-indicator">Chargement...</div>
</div>
{% endif %}
