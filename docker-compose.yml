# db init credentials and app DATABASE_URL must match DATABASE_URL in .env.example (host/port differ).
services:
  db:
    container_name: blockhaus101-db
    image: postgres:18
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=blockhaus101_django
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blockhaus101_django"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    container_name: blockhaus101-app
    image: ghcr.io/bolinocroustibat/blockhaus101:${TAG:-latest}
    build: .
    depends_on:
      db:
        condition: service_healthy
    ulimits:
      core: 0
    volumes:
      - /home/www/blockhaus101/static:/app/static
      - /home/www/blockhaus101/media:/app/media
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # Django core settings
      - ENVIRONMENT=${ENVIRONMENT}
      - DEBUG=${DEBUG}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      # Internal Docker network (not the host DATABASE_URL from .env)
      - DATABASE_URL=postgres://postgres:postgres@db:5432/blockhaus101_django
      # Email settings
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      # External services
      ## OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      ## GetImgAI
      - GETIMGAI_API_KEY=${GETIMGAI_API_KEY}
      ## Twitter API
      - TWITTER_CONSUMER_KEY=${TWITTER_CONSUMER_KEY}
      - TWITTER_CONSUMER_SECRET=${TWITTER_CONSUMER_SECRET}
      - TWITTER_ACCESS_TOKEN=${TWITTER_ACCESS_TOKEN}
      - TWITTER_ACCESS_TOKEN_SECRET=${TWITTER_ACCESS_TOKEN_SECRET}
      ## Sentry
      - SENTRY_DSN=${SENTRY_DSN}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/fr/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  cron:
    container_name: blockhaus101-cron
    image: ghcr.io/bolinocroustibat/blockhaus101:${TAG:-latest}
    build: .
    command: ["/app/cron/entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    ulimits:
      core: 0
    # No ports: cron only runs scheduled tasks, it does not listen for incoming connections
    volumes:
      - /home/www/blockhaus101/static:/app/static
      - /home/www/blockhaus101/media:/app/media
    environment:
      # Django core settings
      - ENVIRONMENT=${ENVIRONMENT}
      - DEBUG=${DEBUG}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      # Internal Docker network (not the host DATABASE_URL from .env)
      - DATABASE_URL=postgres://postgres:postgres@db:5432/blockhaus101_django
      # Email settings
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      # External services
      ## OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      ## GetImgAI
      - GETIMGAI_API_KEY=${GETIMGAI_API_KEY}
      ## Twitter API
      - TWITTER_CONSUMER_KEY=${TWITTER_CONSUMER_KEY}
      - TWITTER_CONSUMER_SECRET=${TWITTER_CONSUMER_SECRET}
      - TWITTER_ACCESS_TOKEN=${TWITTER_ACCESS_TOKEN}
      - TWITTER_ACCESS_TOKEN_SECRET=${TWITTER_ACCESS_TOKEN_SECRET}
      ## Sentry
      - SENTRY_DSN=${SENTRY_DSN}
    restart: unless-stopped

# Volume definitions
volumes:
  postgres_data:
