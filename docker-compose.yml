services:
  app:
    container_name: blockhaus101-app
    image: ghcr.io/bolinocroustibat/blockhaus101:${TAG:-latest}
    build: .
    depends_on:
      - db
    volumes:
      - /home/www/blockhaus101/static:/app/static
      - /home/www/blockhaus101/media:/app/media
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # Django core settings
      - ENVIRONMENT=${ENVIRONMENT}
      - DEBUG=${DEBUG}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      # Database settings
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432  # Internal container port (not the host-mapped port)
      # Email settings
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      # External services
      ## OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      ## GetImgAI
      - GETIMGAI_API_KEY=${GETIMGAI_API_KEY}
      ## Twitter API
      - TWITTER_CONSUMER_KEY=${TWITTER_CONSUMER_KEY}
      - TWITTER_CONSUMER_SECRET=${TWITTER_CONSUMER_SECRET}
      - TWITTER_ACCESS_TOKEN=${TWITTER_ACCESS_TOKEN}
      - TWITTER_ACCESS_TOKEN_SECRET=${TWITTER_ACCESS_TOKEN_SECRET}
      ## Sentry
      - SENTRY_DSN=${SENTRY_DSN}
    restart: unless-stopped

  db:
    container_name: blockhaus101-db
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    restart: unless-stopped

# Volume definitions
volumes:
  postgres_data:
